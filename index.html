<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="shortcut icon" href="icon.svg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav>
        <ul>Crosses and Noughts</ul>
    </nav>
    
    <div class="gameContainer">
        <div class="container">
            <div class="line"></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
        </div>
        
        <div class="gameinfo">
            <h1>Tic Tac Toe</h1>
            
            <div class="player-info">
                <div class="player player-x active" id="player-x">
                    <div class="player-name" id="player-x-name">Player X</div>
                    <div class="player-symbol">X</div>
                </div>
                <div class="player player-o" id="player-o">
                    <div class="player-name" id="player-o-name">Player O</div>
                    <div class="player-symbol">O</div>
                </div>
            </div>
            
            <div class="score-board">
                <div class="score">
                    <div>X Wins</div>
                    <div class="score-value" id="score-x">0</div>
                </div>
                <div class="score">
                    <div>Draws</div>
                    <div class="score-value" id="score-draw">0</div>
                </div>
                <div class="score">
                    <div>O Wins</div>
                    <div class="score-value" id="score-o">0</div>
                </div>
            </div>
            
            <div id="info-reset">
                <span class="info">Turn for X</span>
                <div class="controls">
                    <button id="reset">Reset Game</button>
                    <button id="new-game">New Game</button>
                </div>
            </div>
            
            <div class="game-stats">
                <div class="stats-title">Game Statistics</div>
                <div class="stats-content">
                    <div>Moves: <span id="move-count">0</span></div>
                    <div>Time: <span id="timer">00:00</span></div>
                </div>
            </div>
            
            <div class="imgbox">
                <img src="https://media.giphy.com/media/3o7aD2s1YvZCnQAXU4/giphy.gif" alt="Celebration">
            </div>
        </div>
    </div>
    
    <div class="modal" id="player-modal">
    <div class="modal-content">
        <h2>Enter Player Names</h2>
        <div class="input-group">
            <label for="player1">Player 1 (X):</label>
            <input type="text" id="player1" placeholder="Enter name for X">
        </div>
        <div class="input-group">
            <label for="player2">Player 2 (O):</label>
            <input type="text" id="player2" placeholder="Enter name for O">
        </div>
        <div class="modal-buttons">
            <button id="start-game">Start Game</button>
        </div>
    </div>
</div>
    
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2 id="game-result">Game Over</h2>
            <p id="winner-message"></p>
            <div class="modal-buttons">
                <button id="play-again">Play Again</button>
                <button id="close-modal">Close</button>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Developed by Harsh Yadav | Enhanced Tic Tac Toe</p>
    </footer>
</body>
</html>
